<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070f0c">
<title>贪吃蛇 · Jinhong270</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app" id="app">
  <header class="app-header">
    <h1 class="app-title">贪吃蛇</h1>
    <div class="header-actions">
      <div class="score-panel">
        <div class="score-chip">
          <span class="score-chip-label">分数</span>
          <span class="score-chip-value" id="currentScore">0</span>
        </div>
        <div class="score-chip score-chip-best">
          <span class="score-chip-label">最高分</span>
          <span class="score-chip-value" id="bestScore">0</span>
        </div>
      </div>
      <button class="icon-btn" id="fullscreenBtn" type="button" hidden aria-label="全屏">
        <svg class="icon-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        <svg class="icon-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M16 3v3a2 2 0 0 0 2 2h3M8 21v-3a2 2 0 0 0-2-2H3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
      </button>
    </div>
  </header>

  <div class="workspace">
    <div class="stage" id="stage">
      <div class="board-slot" id="boardSlot">
        <div class="canvas-frame" id="canvasFrame">
          <canvas id="gameCanvas"></canvas>

          <div class="overlay visible" id="overlayIdle">
            <button class="play-button" id="startBtn" type="button">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <span>开始游戏</span>
            </button>
            <p class="overlay-hint" id="idleHint">点击画面或按空格键开始</p>
          </div>

          <div class="overlay" id="overlayPaused">
            <div class="pause-glyph" aria-hidden="true"><span></span><span></span></div>
            <p class="overlay-title">已暂停</p>
            <p class="overlay-hint" id="pausedHint">点击画面或按空格键继续</p>
          </div>

          <div class="overlay" id="overlayGameOver">
            <p class="overlay-title">游戏结束</p>
            <p class="overlay-score">得分 <span id="finalScore">0</span></p>
            <span class="new-best-badge" id="newBestBadge">新纪录</span>
            <button class="restart-button" id="restartFromOverBtn" type="button">再来一局</button>
          </div>

          <div class="toast" id="toast"></div>
        </div>
      </div>

      <div class="dpad" id="dpad">
        <button class="dpad-btn dpad-up" type="button" data-dir="up" aria-label="向上">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5l7 7-1.4 1.4L13 8.8V19h-2V8.8l-4.6 4.6L5 12z"/></svg>
        </button>
        <button class="dpad-btn dpad-left" type="button" data-dir="left" aria-label="向左">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5l7 7-1.4 1.4L13 8.8V19h-2V8.8l-4.6 4.6L5 12z"/></svg>
        </button>
        <button class="dpad-btn dpad-center" id="dpadCenter" type="button" aria-label="开始">
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
        </button>
        <button class="dpad-btn dpad-right" type="button" data-dir="right" aria-label="向右">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5l7 7-1.4 1.4L13 8.8V19h-2V8.8l-4.6 4.6L5 12z"/></svg>
        </button>
        <button class="dpad-btn dpad-down" type="button" data-dir="down" aria-label="向下">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5l7 7-1.4 1.4L13 8.8V19h-2V8.8l-4.6 4.6L5 12z"/></svg>
        </button>
      </div>
    </div>

    <aside class="controls-panel">
      <section class="control-group">
        <div class="control-group-title">速度</div>
        <div class="mode-selector" id="modeSelector">
          <button class="mode-btn" type="button" data-speed="180">慢速</button>
          <button class="mode-btn active" type="button" data-speed="130">正常</button>
          <button class="mode-btn" type="button" data-speed="90">快速</button>
          <button class="mode-btn" type="button" data-speed="60">极速</button>
        </div>
      </section>

      <section class="control-group">
        <div class="control-group-title">背景色</div>
        <div class="color-swatches" id="colorSwatches">
          <button class="swatch active" type="button" data-color="#0b0b0b" style="background:#0b0b0b;" aria-label="经典黑" aria-pressed="true"></button>
          <button class="swatch" type="button" data-color="#08131f" style="background:#08131f;" aria-label="深邃蓝" aria-pressed="false"></button>
          <button class="swatch" type="button" data-color="#071a10" style="background:#071a10;" aria-label="暗夜绿" aria-pressed="false"></button>
          <button class="swatch" type="button" data-color="#150c1f" style="background:#150c1f;" aria-label="神秘紫" aria-pressed="false"></button>
          <button class="swatch" type="button" data-color="#17191b" style="background:#17191b;" aria-label="石墨灰" aria-pressed="false"></button>
          <button class="swatch" type="button" data-color="#0d1b26" style="background:#0d1b26;" aria-label="深海蓝" aria-pressed="false"></button>
          <button class="swatch" type="button" data-color="#200d0d" style="background:#200d0d;" aria-label="暗红褐" aria-pressed="false"></button>
          <button class="swatch" type="button" data-color="#0d2016" style="background:#0d2016;" aria-label="丛林绿" aria-pressed="false"></button>
          <button class="swatch" type="button" data-color="#221708" style="background:#221708;" aria-label="古铜色" aria-pressed="false"></button>
        </div>
      </section>

      <section class="control-group button-group">
        <button class="action-btn primary" id="restartBtn" type="button">开始游戏</button>
        <button class="action-btn secondary" id="pauseBtn" type="button" disabled>
          <span class="btn-icon icon-pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></span>
          <span class="btn-icon icon-play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
          <span class="btn-label">暂停</span>
        </button>
        <button class="action-btn ghost" id="toggleDpadBtn" type="button" aria-pressed="false">
          <span class="when-off"><span class="lbl-full">显示方向键</span><span class="lbl-tiny">方向键</span></span>
          <span class="when-on"><span class="lbl-full">隐藏方向键</span><span class="lbl-tiny">收起</span></span>
        </button>
      </section>

      <p class="hint-text" id="hint"></p>
    </aside>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/renderer.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
