<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="description" content="现代美观的贪吃蛇游戏，深度适配手机与电脑">
    <title>贪吃蛇(Made by Jinhong270)</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="game-container" id="gameContainer">
        <header class="header">
            <h1>贪吃蛇</h1>
            <p class="subtitle">Modern · Smooth · Beautiful</p>
        </header>

        <div class="score-row">
            <div class="score-box">
                <div class="score-label">当前分数</div>
                <div class="score-value" id="currentScore">0</div>
            </div>
            <div class="score-box best-box">
                <div class="score-label">最高纪录</div>
                <div class="score-value best" id="bestScore">0</div>
            </div>
        </div>

        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="controls-panel">
            <div class="mode-selector" id="modeSelector">
                <button class="mode-btn" data-speed="180">慢速</button>
                <button class="mode-btn active" data-speed="130">正常</button>
                <button class="mode-btn" data-speed="90">快速</button>
                <button class="mode-btn" data-speed="60">极速</button>
            </div>

            <div class="color-section">
                <span class="color-label">背景</span>
                <div class="color-swatches" id="colorSwatches">
                    <div class="swatch active" data-color="#0a0a0f" style="background:#0a0a0f;" title="深空黑"></div>
                    <div class="swatch" data-color="#0b1426" style="background:#0b1426;" title="午夜蓝"></div>
                    <div class="swatch" data-color="#0c1a12" style="background:#0c1a12;" title="暗林绿"></div>
                    <div class="swatch" data-color="#1a0f24" style="background:#1a0f24;" title="暗紫"></div>
                    <div class="swatch" data-color="#1c1c1e" style="background:#1c1c1e;" title="石墨"></div>
                    <div class="swatch" data-color="#0f1c2e" style="background:#0f1c2e;" title="深海"></div>
                    <div class="swatch" data-color="#2a1215" style="background:#2a1215;" title="酒红"></div>
                    <div class="swatch" data-color="#12251c" style="background:#12251c;" title="墨绿"></div>
                    <div class="swatch" data-color="#1e1530" style="background:#1e1530;" title="紫罗兰"></div>
                    <div class="swatch" data-color="#2a2118" style="background:#2a2118;" title="古铜"></div>
                </div>
            </div>

            <div class="btn-row">
                <button class="restart-btn" id="restartBtn">开始游戏</button>
                <button class="pause-btn" id="pauseBtn">暂停</button>
                <button class="toggle-dpad-btn" id="toggleDpadBtn">显示方向键</button>
            </div>

            <div class="dpad" id="dpad">
                <button class="dpad-btn dpad-up" id="dpadUp" aria-label="上">▲</button>
                <button class="dpad-btn dpad-left" id="dpadLeft" aria-label="左">◀</button>
                <button class="dpad-btn dpad-right" id="dpadRight" aria-label="右">▶</button>
                <button class="dpad-btn dpad-down" id="dpadDown" aria-label="下">▼</button>
            </div>

            <p class="hint" id="hint">方向键 / WASD 控制 · 空格暂停 · 点击色块换背景</p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/input.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
